<!doctype html><html lang="ru"><meta charset="utf-8"><title>STUDLY · QA платформы</title><style>body{margin:0;background:#dfe4ee;font:14px system-ui}header{padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{min-height:44px}iframe{width:390px;height:844px;border:0;display:block}</style><header><strong>Только тест · эмуляция CSS</strong><button id="safe">Safe areas: 24 / 34 / 30</button><button id="motion">Reduced Motion</button><output id="result"></output></header><iframe title="STUDLY preview" src="/?qa=platform"></iframe><script>
const frame=document.querySelector('iframe');
document.querySelector('#safe').onclick=()=>{const root=frame.contentDocument.querySelector('.studly-app');for(const [edge,value] of [['top',24],['bottom',34],['left',30],['right',30]])root.style.setProperty('--studly-safe-'+edge,value+'px','important');document.querySelector('#result').textContent='Safe areas применены';};
document.querySelector('#motion').onclick=()=>{let count=0;function walk(rules){for(const rule of rules){if(rule.media&&rule.conditionText.includes('prefers-reduced-motion')){rule.media.mediaText='all';count++;}else if(rule.cssRules)walk(rule.cssRules);}}for(const sheet of frame.contentDocument.styleSheets){try{walk(sheet.cssRules);}catch{}}document.querySelector('#result').textContent='Reduced Motion rules: '+count;};
</script></html>
