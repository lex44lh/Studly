name: Backend checks

'on':
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend.yml'
      - 'compose.yaml'
      - 'docs/registration.openapi.json'
      - 'deploy/firstvds/**'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend.yml'
      - 'compose.yaml'
      - 'docs/registration.openapi.json'
      - 'deploy/firstvds/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            postgres: '17'
          - python: '3.12'
            postgres: '16'

    defaults:
      run:
        shell: bash
        working-directory: apps/api

    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: django-insecure-studly-ci-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: studly_ci
      POSTGRES_USER: studly
      # Только временная БД этого задания; рабочие секреты не используются.
      POSTGRES_PASSWORD: studly-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: studly_ci
          POSTGRES_USER: studly
          POSTGRES_PASSWORD: studly-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studly -d studly_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-production.txt

      - name: Install Backend and production dependencies
        run: python -m pip install -r requirements-production.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check Django configuration
        run: python manage.py check

      - name: Check Gunicorn production startup
        env:
          DJANGO_SETTINGS_MODULE: config.production
          DJANGO_DEBUG: 'false'
        run: python -m gunicorn --check-config config.wsgi:application

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to empty database
        run: python manage.py migrate --noinput

      - name: Run Backend tests
        run: python manage.py test --noinput --verbosity 2
