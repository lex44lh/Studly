# Separate vhost. Do not replace studly-help.ru or its existing services.
log_format studly_live '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name live-test.studly-help.ru;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://live-test.studly-help.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name live-test.studly-help.ru;
    ssl_certificate /etc/letsencrypt/live/live-test.studly-help.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-test.studly-help.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    # Synthetic-only stand; no query strings, bodies or cookies in access logs.
    access_log /var/log/nginx/studly-live.access.log studly_live;
    error_log /var/log/nginx/studly-live.error.log warn;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location /api/ {
        proxy_pass http://unix:/run/studly-live-api/api.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /admin/ { return 404; }
    location /media/ { return 404; }
    location /django-static/ { alias /srv/studly-live/static/; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
