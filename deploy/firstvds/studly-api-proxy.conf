# /etc/nginx/snippets/studly-api-proxy.conf
# Заголовок клиента не используется: Django доверяет только нашему значению.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host "";
proxy_redirect off;
proxy_read_timeout 35s;
proxy_pass http://unix:/run/studly-api/api.sock;
