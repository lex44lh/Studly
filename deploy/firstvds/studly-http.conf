# До выпуска сертификата включается только этот файл.
server {
    listen 80;
    listen [::]:80;
    server_name studly-help.ru;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://studly-help.ru$request_uri;
    }
}
