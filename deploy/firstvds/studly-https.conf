# Включать только после выпуска сертификата для studly-help.ru.
# Не создавать одноимённый сайт через ispmanager: этот vhost управляется Git.
log_format studly_api '$remote_addr [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studly-help.ru;

    ssl_certificate /etc/letsencrypt/live/studly-help.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studly-help.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    # Не записывать OAuth code/state из query string в access log.
    access_log /var/log/nginx/studly-api.access.log studly_api;
    error_log /var/log/nginx/studly-api.error.log warn;

    location /api/ {
        include /etc/nginx/snippets/studly-api-proxy.conf;
    }
    location /admin/ {
        include /etc/nginx/snippets/studly-api-proxy.conf;
    }
    location /django-static/ {
        alias /srv/studly/static/;
        add_header X-Content-Type-Options nosniff always;
    }
    # Аватары отдаёт только приватный маршрут Django, без публичного alias.
    location /media/ {
        return 404;
    }
    # Включать этот вариант после сборки Frontend и запуска studly-web.service.
    location / {
        include /etc/nginx/snippets/studly-web-proxy.conf;
    }
}
